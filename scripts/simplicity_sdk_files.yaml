paths:
  - "License.txt"
  - package: cmsis_common
    paths:
      - "platform/common/inc/*.h"
  - package: platform_common
    paths:
      - "platform/common/inc/*.h"
      - "platform/common/src/sl_assert.c"
      - "platform/common/src/sl_slist.c"
      - "platform/common/src/sl_string.c"
  - package: platform_core
    paths:
      - "platform/common/inc/*.h"
      - "platform/common/config/sl_core_config.h"
      - "platform/common/src/sl_core_cortexm.c"
      - "platform/driver/gpio/inc/*.h"
      - "platform/driver/gpio/src/*.c"
      - "platform/driver/i2c/inc/*.h"
      - "platform/driver/i2c/src/*.[ch]"
      - "platform/emdrv/common/inc/*.h"
      - "platform/emdrv/dmadrv/config/s2_8ch/*.h"
      - "platform/emdrv/dmadrv/inc/*.h"
      - "platform/emdrv/dmadrv/inc/s2_signals/*.h"
      - "platform/emdrv/dmadrv/src/*.c"
      - "platform/emlib/inc/*.h"
      - "platform/emlib/src/*.c"
      - "platform/peripheral/inc/*.h"
      - "platform/peripheral/src/*.c"
      - "platform/service/clock_manager/config/**/*.h" # TODO
      - "platform/service/clock_manager/inc/*.h"
      - "platform/service/clock_manager/src/*.[ch]"
      - "platform/service/device_init/config/**/*.h" # TODO
      - "platform/service/device_init/inc/*.h"
      - "platform/service/device_init/src/*.[ch]"
      - "platform/service/device_manager/**/*.[ch]"
      - "platform/service/hfxo_manager/config/**/*.h" # TODO
      - "platform/service/hfxo_manager/inc/*.h"
      - "platform/service/hfxo_manager/src/*.[ch]"
      - "platform/service/interrupt_manager/inc/*.h"
      - "platform/service/mem_pool/inc/*.h"
      - "platform/service/mem_pool/src/*.[ch]"
      - "platform/service/memory_manager/config/*.h" # TODO
      - "platform/service/memory_manager/inc/*.h"
      - "platform/service/memory_manager/src/*.[ch]"
      - "platform/service/memory_manager/profiler/config/*.h" # TODO
      - "platform/service/memory_manager/profiler/inc/*.h"
      - "platform/service/memory_manager/profiler/src/*.c"
      - "platform/service/power_manager/config/**/*.h" # TODO
      - "platform/service/power_manager/inc/*.h"
      - "platform/service/power_manager/src/*/*.[ch]"
      - "platform/service/sleeptimer/config/**/*.h" # TODO
      - "platform/service/sleeptimer/inc/*.h"
      - "platform/service/sleeptimer/src/*.[ch]"
      # Platform CLI (Zlib). Zephyr Shell owns line editing, so
      # sl_cli_input.c (echo/history/tab-complete) and the delay,
      # simple_password, threaded_host headers (unused tick-loop extras)
      # are intentionally not imported. Zephyr uses Shell + sl_cli_io_zephyr;
      # no iostream.
      - "platform/service/cli/inc/sl_cli.h"
      - "platform/service/cli/inc/sl_cli_arguments.h"
      - "platform/service/cli/inc/sl_cli_command.h"
      - "platform/service/cli/inc/sl_cli_input.h"
      - "platform/service/cli/inc/sl_cli_tokenize.h"
      - "platform/service/cli/inc/sl_cli_types.h"
      - "platform/service/cli/config/sl_cli_config.h"
      - "platform/service/cli/src/sl_cli.c"
      - "platform/service/cli/src/sl_cli_arguments.c"
      - "platform/service/cli/src/sl_cli_command.c"
      - "platform/service/cli/src/sl_cli_tokenize.c"
      - "platform/service/cli/src/sli_cli_*.h"
      - "platform/service/token_manager/config/sl_token_manager_config.h"
      - "platform/service/token_manager/inc/sl_token_manager_api.h"
      - "platform/service/token_manager/inc/sl_token_manager_defines.h"
      - "platform/service/token_manager/inc/sl_token_manager_lock.h"
      - "platform/service/token_manager/inc/sl_token_manager_manufacturing.h"
      - "platform/service/token_manager/src/sli_token_manager_internal.h"
      - "platform/service/token_manager/src/sli_token_manager_manufacturing.c"
      - "platform/service/udelay/inc/*.h"
      - "platform/service/udelay/src/*.[chsS]"
  - package: devices
    paths:
      - "platform/Device/SiliconLabs/EFR32BG2[24679]/Include/*.h"
      - "platform/Device/SiliconLabs/EFR32BG2[24679]/Source/system_*.c"
      - "platform/Device/SiliconLabs/EFR32FG2[38]/Include/*.h"
      - "platform/Device/SiliconLabs/EFR32FG2[38]/Source/system_*.c"
      - "platform/Device/SiliconLabs/EFR32MG2[124679]/Include/*.h"
      - "platform/Device/SiliconLabs/EFR32MG2[124679]/Source/system_*.c"
      - "platform/Device/SiliconLabs/EFR32ZG2[38]/Include/*.h"
      - "platform/Device/SiliconLabs/EFR32ZG2[38]/Source/system_*.c"
      - "platform/Device/SiliconLabs/EFM32PG2[368]/Include/*.h"
      - "platform/Device/SiliconLabs/EFM32PG2[368]/Source/system_*.c"
      - "platform/Device/SiliconLabs/MGM2[46]/Include/*.h"
      - "platform/Device/SiliconLabs/MGM2[46]/Source/system_*.c"
      - "platform/Device/SiliconLabs/BGM2[246]/Include/*.h"
      - "platform/Device/SiliconLabs/BGM2[246]/Source/system_*.c"
  - package: rail_library
    prefix: platform/radio/rail_lib
    paths:
      - "chip/**/*.[ch]"
      - "common/*.[ch]"
      - "plugin/pa-conversions/**/*.[ch]"
      - "plugin/sl_rail_util_compatible_pa/*.[ch]"
      - "plugin/sl_rail_util_pa_conversions/*.[ch]"
      - "plugin/sl_rail_util_pa_tables/*.[ch]"
      - "plugin/sl_rail_util_pa_tables/efr32xg2[12346789]/*.[ch]"
      - "plugin/sl_rail_util_protocol/**/*.[ch]"
      - "plugin/sl_rail_util_rf_path_switch/*.[ch]"
      - "plugin/sl_rail_util_sequencer/*.[ch]"
      - "protocol/**/*.[ch]"
  - package: security_se_manager
    paths:
      - "platform/security/sl_component/se_manager/**/*.[ch]"
      - "platform/security/sl_component/sli_psec_osal/**/*.[ch]"
  - package: security_mbedtls
    paths:
      - "platform/security/sl_component/sl_mbedtls_support/config/*.[ch]"
      - "platform/security/sl_component/sl_mbedtls_support/inc/*.[ch]"
      - "platform/security/sl_component/sl_mbedtls_support/src/*.[ch]"
      - "platform/security/sl_component/sl_protocol_crypto/**/*.[ch]"
      - "platform/security/sl_component/sl_psa_driver/*/*.[ch]"
      - "platform/security/sl_component/sli_crypto/**/*.[ch]"
  - package: bluetooth_le_controller
    prefix: protocol/bluetooth/bgstack/ll
    paths:
      - "inc/*.h"
      - "src/*.c"
  - package: bluetooth_common
    prefix: protocol/bluetooth/bgcommon
    paths: []

configs:
  - "platform/common/config/sl_core_config.h"
