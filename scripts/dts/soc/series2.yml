    families:
      - name: efr32bg22
        representative_device: EFR32BG22C224F512IM40
      - name: efr32mg22
      - name: efr32fg22
      - name: bgm22
    clocks: platform/service/device_manager/devices/sl_device_peripheral_hal_efr32xg22.c
  - name: xg23
    families:
      - name: efr32zg23
        representative_device: EFR32ZG23B021F512IM40
      - name: efr32fg23
      - name: efm32pg23
    clocks: platform/service/device_manager/devices/sl_device_peripheral_hal_efr32xg23.c
  - name: xg24
    families:
      - name: efr32mg24
        representative_device: EFR32MG24B220F1536IM48
      - name: efr32bg24
      - name: mgm24
      - name: bgm24
