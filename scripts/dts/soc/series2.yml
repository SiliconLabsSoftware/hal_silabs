  - name: xg26
    families:
      - name: efr32mg26
        representative_device: EFR32MG26B521F3200IM68
      - name: efr32bg26
      - name: efm32pg26
      - name: mgm26
      - name: bgm26
    clocks: platform/service/device_manager/devices/sl_device_peripheral_hal_efr32xg26.c
  - name: xg27
    families:
      - name: efr32bg27
        representative_device: EFR32BG27C140F768IM40
      - name: efr32mg27
    clocks: platform/service/device_manager/devices/sl_device_peripheral_hal_efr32xg27.c
  - name: xg28
    families:
      - name: efr32zg28
        representative_device: EFR32ZG28B322F1024IM68
      - name: efr32fg28
      - name: efm32pg28
    clocks: platform/service/device_manager/devices/sl_device_peripheral_hal_efr32xg28.c
  - name: xg29
