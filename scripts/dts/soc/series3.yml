configs:
  - name: six301
    families:
      - name: simg301
        representative_device: SiMG301M114LIH
      - name: sibg301
    clocks: platform/service/device_manager/devices/sl_device_peripheral_hal_sixx301.c

clocks:
  skip:
    - rhclk
    - exportclk
    - clkout
  selection:
    sysclk: socpll
    hclk: sysclk
    pclk: hclk
    lspclk: pclk
    hfxo0lfclk: lfrco
  divider:
    pclk: 2
    lspclk: 2
  extra_children:
    pclk: [lspclk]

peripherals:
  - svd: cmu
    node: clock
    binding: "silabs,series-clock"
    include: "zephyr/dt-bindings/clock/silabs/{config}-clock.h"
    status: okay
  - svd: fsrco
    binding: "fixed-clock"
    properties:
      clock-frequency: DT_FREQ_M(20)
  - svd: hfxo\d
    node: hfxo
    binding: "silabs,hfxo"
    labels: ["clk_hfxo", hfxo]
    properties:
      clock-frequency: DT_FREQ_K(38400)
      ctune: [140]
      precision: 50
    status: disabled
  - svd: lfxo
    binding: "silabs,series2-lfxo"
    properties:
      clock-frequency: 32768
      ctune: 63
      precision: 50
      timeout: 4096
    status: disabled
  - svd: hfrco0
    node: hfrcodpll
    labels: [hfrcodpll]
    binding: "silabs,series2-hfrcodpll"
    properties:
      clock-frequency: DT_FREQ_M(38)
  - svd: hfrcoem23
    binding: "silabs,series2-hfrcoem23"
    properties:
      clock-frequency: DT_FREQ_M(20)
  - svd: lfrco
    binding: "silabs,series2-lfrco"
    properties:
      clock-frequency: 32768
  - svd: ulfrco
    binding: "fixed-clock"
    properties:
      clock-frequency: 1000
  - svd: socpll0
    labels: [socpll]
    binding: "silabs,socpll"
    properties:
      clock-frequency: DT_FREQ_M(150)
  - svd: eusart0
    node: eusart
    binding: "silabs,eusart-uart"
    interrupts: ["{peripheral}_rx", "{peripheral}_tx"]
    status: disabled
    skip_default_properties: true # Don't emit default properties since user can swap to spi binding
  - svd: eusart
    node: eusart
    binding: "silabs,eusart-spi"
    interrupts: ["{peripheral}_rx", "{peripheral}_tx"]
    status: disabled
    skip_default_properties: true # Don't emit default properties since user can swap to uart binding
  - svd: adc
    node: adc
    labels: [adc0]
    binding: "silabs,series3-adc"
    include: "zephyr/dt-bindings/adc/adc.h"
    status: disabled
  - svd: burtc
    labels: [burtc0]
    binding: "silabs,burtc-counter"
    status: disabled
  - svd: semailbox
    labels: [se]
    binding: "silabs,gecko-semailbox"
    chosen: "zephyr,entropy"
    interrupts: [setamperhost, "sembrx", "sembtx"]
    status: disabled
    properties:
      ranges: true
      '#address-cells': 1
      '#size-cells': 1
    children:
      - handler: extmem
        labels: [extmem]
        node: flash-controller
        binding: silabs,series3-extmem
        properties:
          ranges: true
          '#address-cells': 1
          '#size-cells': 1
        children:
          - node: flash
            labels: [flash0]
            binding: "soc-nv-flash"
            address:
              cmsis_symbol: memory.flash.base
            properties:
              '#address-cells': 1
              '#size-cells': 1
              write-block-size: 4
              erase-block-size:
                cmsis_symbol: memory.flash.page_size
  - svd: i2c
    node: i2c
    binding: "silabs,i2c"
    include: "zephyr/dt-bindings/i2c/i2c.h"
    properties:
      clock-frequency: I2C_BITRATE_STANDARD
    status: disabled
  - svd: sysrtc
    node: sysrtc
    binding: "silabs,sysrtc"
    chosen: "silabs,sleeptimer"
    labels: [sysrtc0]
    interrupts: [sysrtc_app, sysrtc_seq]
    status: disabled
    properties:
      clock-frequency: 32768
      prescaler: 1
  - svd: gpio
    binding: "silabs,gpio"
    include: "zephyr/dt-bindings/gpio/gpio.h"
    properties:
      ranges: true
      '#address-cells': 1
      '#size-cells': 1
    children:
      - handler: gpio
        node: gpio
        binding: "silabs,gpio-port"
        properties:
          gpio-controller: true
        status: disabled
    siblings:
      - handler: pinctrl
        node: pin-controller
        binding: "silabs,dbus-pinctrl"
      - handler: clkin0
        node: clkin0
        binding: "fixed-clock"
        properties:
          clock-frequency: DT_FREQ_M(38)
  - svd: ldma0
    node: dma
    labels: [dma0]
    binding: "silabs,ldma"
    include: "zephyr/dt-bindings/dma/silabs/{config}-dma.h"
    properties:
      dma-channels:
        cmsis_symbol: CH_NUM
    status: disabled
  - svd: wdog
    node: wdog
    binding: "silabs,wdog"
    status: disabled
  - svd: acmp
    node: acmp
    binding: "silabs,acmp"
    status: disabled
  - svd: timer
    node: timer
    binding: "silabs,series2-timer"
    properties:
      channels:
        cmsis_symbol: CC_NUM
      counter-size:
        cmsis_symbol: CNTWIDTH
    children:
      - node: counter
        binding: "silabs,timer-counter"
        status: disabled
      - node: pwm
        binding: "silabs,timer-pwm"
        status: disabled
    status: disabled
  - svd: letimer
    node: letimer
    binding: "silabs,series2-letimer"
    children:
      - node: pwm
        binding: "silabs,letimer-pwm"
        status: disabled
    status: disabled
  - svd: buram
    node: retained-memory
    binding: "silabs,buram"
    reg_mode: narrow
    status: disabled
  - svd: gpcrc
    labels: [gpcrc]
    binding: "silabs,gpcrc"
    chosen: "zephyr,crc"
    status: okay
  - svd: (lpwaes|symcrypto)
    binding: "silabs,series3-crypto"
    status: disabled

# skipped peripherals
  - svd: scratchpad
    skip: true # unused
  - svd: semaphore
    skip: true # TODO
  - svd: emu
    skip: true # handled by PM subsystem
  - svd: dpll0
    skip: true # handled by the HFRCODPLL peripheral
  - svd: l1icache0
    skip: true # configuration not yet exposed in Zephyr
  - svd: l2icache0
    skip: true # configuration not yet exposed in Zephyr
  - svd: prs
    skip: true # PRS config is distributed 
  - svd: ldmaxbar
    skip: true # handled by the LDMA peripheral
  - svd: devinfo
    skip: true # system config is handled by the SoC
  - svd: syscfg
    skip: true # system config is handled by the SoC
  - svd: seportal
    skip: true # handled by the se driver
  - svd: hostportal
    skip: true # handled by the radio driver
  - svd: lpw0portal
    skip: true # handled by the radio driver
  - svd: rpa
    skip: true # handled by the radio driver
  - svd: leddrv
    skip: true # configuration not yet exposed in Zephyr
  - svd: pixelrz
    skip: true # configuration not yet exposed in Zephyr
  - svd: dmem
    skip: true # configuration not yet exposed in Zephyr
  - svd: smu
    skip: true # configuration not yet exposed in Zephyr
  - svd: pcnt
    skip: true # missing peripheral driver
  - svd: etampdet
    skip: true # missing peripheral driver
  - svd: ksu
    skip: true # missing peripheral driver
